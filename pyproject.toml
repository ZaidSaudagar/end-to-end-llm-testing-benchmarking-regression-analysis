[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "end-to-end-llm-testing-benchmarking-and-regression-analysis"
version = "0.1.0"
description = "LLM evaluation, benchmarking, and regression analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "streamlit>=1.39.0",
    "sqlalchemy>=2.0.33",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.2",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.1",
    "plotly>=5.24.0",
    "sentence-transformers>=3.2.1",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*", "dashboard*"]

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]
